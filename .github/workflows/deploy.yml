name: Deploy to S3

on:
  push:
    branches:
      - main  # Triggered whenever you push to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code from GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Setup Node.js
        uses: actions/checkout@v4
        with:
          node-version: '20' # Matches most modern Vue projects

      # 3. Install dependencies and build the project
      - name: Install & Build
        run: |
          npm install
          npm run build

      # 4. Configure AWS Credentials from GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1 # Change to your bucket's region (e.g., us-east-1)

      # 5. Sync the 'dist' folder to S3
      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET }} --delete